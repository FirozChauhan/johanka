services:
  johanka:
    build: .
    image: johanka:latest
    container_name: johanka
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # SQLite database + any runtime settings saved via /settings
      - johanka-data:/app/data
      # Auto-generated poster frames (persists across restarts)
      - johanka-thumbs:/app/public/thumbs
    environment:
      # Option A: set credentials via env (recommended for production).
      # Option B: leave blank and configure them in the /settings UI instead.
      STREAMTAPE_LOGIN: ${STREAMTAPE_LOGIN:-}
      STREAMTAPE_KEY: ${STREAMTAPE_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  johanka-data:
  johanka-thumbs:
