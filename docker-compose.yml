services:
  johanka:
    build:
      context: .
      # Pass the host's git version so the footer stays in sync with the
      # latest commit even though .git is excluded from the image. Build with:
      #   APP_VERSION="$(git describe --tags --always)" docker compose up --build
      args:
        APP_VERSION: ${APP_VERSION:-}
    image: johanka:latest
    container_name: johanka
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Option A: set credentials via env (recommended for production).
      # Option B: leave blank and configure them in the /settings UI instead.
      STREAMTAPE_LOGIN: ${STREAMTAPE_LOGIN:-}
      STREAMTAPE_KEY: ${STREAMTAPE_KEY:-}
      # Optional: scope the library to a single StreamTape folder (uploads go
      # into it too). Leave blank for the whole account.
      STREAMTAPE_FOLDER_ID: ${STREAMTAPE_FOLDER_ID:-}
      # Optional: persistent settings storage (thumbnails come from StreamTape).
      DATABASE_URL: ${DATABASE_URL:-}
      # Optional: Google sign-in (Firebase). NEXT_PUBLIC_* are inlined at build
      # time; the FIREBASE_* service-account fields are read at runtime.
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
